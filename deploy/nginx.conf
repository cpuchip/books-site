# books.cpuchip.net: static files only. No access log: the site keeps no record of its readers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        try_files $uri $uri/ =404;
    }
}
