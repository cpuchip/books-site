# books.cpuchip.net: static files only. No access log: the site keeps no record of its readers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # compressed for a client that asks (the search index and graph.json are most of the bytes); verifylive asks for
    # identity, so the bytes it compares are the built files'
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    location / {
        try_files $uri $uri/ =404;
    }
}
